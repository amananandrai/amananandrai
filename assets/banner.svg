<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="Aman Anand Rai, ML and Gen AI">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07130a"/><stop offset=".45" stop-color="#0b1020"/><stop offset="1" stop-color="#2a1250"/></linearGradient>
<radialGradient id="gl" cx="0" cy=".55" r=".6"><stop offset="0" stop-color="#4cff2a" stop-opacity=".55"/><stop offset="1" stop-color="#4cff2a" stop-opacity="0"/></radialGradient>
<radialGradient id="gr" cx="1" cy=".5" r=".55"><stop offset="0" stop-color="#d3202f" stop-opacity=".45"/><stop offset=".6" stop-color="#1f4aa8" stop-opacity=".25"/><stop offset="1" stop-color="#1f4aa8" stop-opacity="0"/></radialGradient>
<linearGradient id="bm" x1="0" x2="1"><stop offset="0" stop-color="#4cff2a" stop-opacity="0"/><stop offset=".25" stop-color="#4cff2a"/><stop offset=".8" stop-color="#eaffe0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
</defs>
<rect width="880" height="260" fill="url(#bg)"/>
<rect width="880" height="260" fill="url(#gl)"><animate attributeName="opacity" values=".6;1;.6" dur="2.4s" repeatCount="indefinite"/></rect>
<rect width="880" height="260" fill="url(#gr)"><animate attributeName="opacity" values="1;.5;1" dur="1.6s" repeatCount="indefinite"/></rect>
<!-- energy beam -->
<g transform="translate(0,168)">
 <rect x="0" y="-10" width="700" height="20" fill="#4cff2a" opacity=".35" filter="url(#blur)"><animate attributeName="opacity" values=".2;.55;.2" dur="1.2s" repeatCount="indefinite"/></rect>
 <rect x="0" y="-3" width="700" height="6" rx="3" fill="url(#bm)" filter="url(#glow)"><animate attributeName="height" values="5;9;5" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="-2.5;-4.5;-2.5" dur="1.2s" repeatCount="indefinite"/></rect>
 <polyline points="0,0 60,-12 120,8 190,-14 260,9 330,-10 400,7 470,-12 540,6 620,-8 700,0" fill="none" stroke="#b8ff9a" stroke-width="1.6" stroke-dasharray="14 10" opacity=".9"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur=".7s" repeatCount="indefinite"/></polyline>
</g>
<!-- impact -->
<g transform="translate(700,168)" filter="url(#glow)">
 <circle r="10" fill="#fff"><animate attributeName="r" values="8;14;8" dur="1.2s" repeatCount="indefinite"/></circle>
 <circle r="14" fill="none" stroke="#5aa0ff" stroke-width="2"><animate attributeName="r" values="8;60" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="1.2s" repeatCount="indefinite"/></circle>
 <circle r="14" fill="none" stroke="#f2b632" stroke-width="1.5"><animate attributeName="r" values="8;42" dur="1.2s" begin=".4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="1.2s" begin=".4s" repeatCount="indefinite"/></circle>
</g>
<!-- Thor lightning, top right -->
<polyline points="860,0 835,40 852,46 818,100 840,106 800,170" fill="none" stroke="#9cc8ff" stroke-width="2.2" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;0;1;0;.8;0;0" dur="2.6s" repeatCount="indefinite"/></polyline>

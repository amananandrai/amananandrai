<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#4cff2a" stop-opacity="0"/><stop offset=".3" stop-color="#4cff2a"/><stop offset=".7" stop-color="#5aa0ff"/><stop offset="1" stop-color="#d3202f" stop-opacity="0"/></linearGradient>
